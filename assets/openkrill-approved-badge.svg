<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="320" height="100">
  <defs>
    <clipPath id="logo-clip">
      <circle cx="50" cy="50" r="38"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="320" height="100" fill="#2a2d3e"/>

  <!-- Accent stripe -->
  <rect width="100" height="100" fill="#5277C3"/>

  <!-- Logo -->
  <image
    x="12" y="12"
    width="76" height="76"
    href="data:image/png;base64,"
    clip-path="url(#logo-clip)"
  />

  <!-- Text -->
  <text
    x="210" y="40"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="bold"
    font-size="26"
    fill="#e0e0e0"
  >openkrill</text>
  <text
    x="210" y="70"
    text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-weight="bold"
    font-size="22"
    fill="#e0e0e0"
  >approved</text>
</svg>
